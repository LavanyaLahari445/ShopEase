<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f6fb;
            color: #212529;
        }

        /* Navigation */
        .navbar {
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 750;
            color: #2457d6;
        }

        .navbar-brand i {
            margin-right: 8px;
        }

        .back-link {
            text-decoration: none;
            color: #495057;
            font-weight: 600;
        }

        .back-link:hover {
            color: #2457d6;
        }

        /* Main section */
        .main-section {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .product-card {
            width: 100%;
            max-width: 760px;
            background: #ffffff;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(28, 45, 85, 0.09);
        }

        .product-header {
            padding: 30px;
            color: #ffffff;
            background: linear-gradient(120deg, #2457d6, #527df4);
        }

        .product-header h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-header p {
            margin: 0;
            color: #e8edff;
        }

        .product-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.17);
            border-radius: 14px;
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .product-body {
            padding: 32px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.94rem;
            margin-bottom: 8px;
            color: #343a40;
        }

        .form-control {
            min-height: 48px;
            border: 1px solid #dce2ec;
            border-radius: 9px;
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #527df4;
            box-shadow: 0 0 0 3px rgba(82, 125, 244, 0.13);
        }

        .form-text {
            font-size: 0.8rem;
        }

        .btn-add {
            min-height: 49px;
            border-radius: 9px;
            background: #2457d6;
            border: none;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-add:hover {
            background: #1945b5;
            transform: translateY(-1px);
        }

        .btn-reset {
            min-height: 49px;
            border-radius: 9px;
            font-weight: 600;
        }

        .required-note {
            color: #6c757d;
            font-size: 0.84rem;
        }

        /* Mobile */
        @media (max-width: 576px) {
            .main-section {
                padding: 22px 12px;
                align-items: flex-start;
            }

            .product-card {
                border-radius: 14px;
            }

            .product-header {
                padding: 22px 18px;
            }

            .product-icon {
                width: 48px;
                height: 48px;
                font-size: 1.4rem;
            }

            .product-body {
                padding: 22px 18px;
            }

            .back-text {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shop"></i>ShopEase
            </a>

            <a href="AdminHome.jsp" class="back-link">
                <i class="bi bi-arrow-left"></i>
                <span class="back-text">Back to Admin Home</span>
            </a>
        </div>
    </nav>

    <!-- Product Form -->
    <main class="main-section">
        <div class="card product-card">

            <div class="product-header">
                <div class="d-flex align-items-center gap-3">
                    <div class="product-icon">
                        <i class="bi bi-box-seam"></i>
                    </div>

                    <div>
                        <h1>Add New Product</h1>
                        <p>Enter the details to add a product to your inventory.</p>
                    </div>
                </div>
            </div>

            <div class="product-body">

                <p class="required-note mb-4">
                    Fields marked with * are required.
                </p>

                <form action="aps" method="post">

                    <div class="row g-3">

                        <div class="col-12 col-md-6">
                            <label for="pcode" class="form-label">
                                Product Code *
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="pcode"
                                   name="pcode"
                                   placeholder="e.g. PRD101"
                                   required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="pname" class="form-label">
                                Product Name *
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="pname"
                                   name="pname"
                                   placeholder="Enter product name"
                                   required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="pcompany" class="form-label">
                                Product Company *
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="pcompany"
                                   name="pcompany"
                                   placeholder="Enter company name"
                                   required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="ppricee" class="form-label">
                                Product Price *
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">₹</span>
                                <input type="number"
                                       class="form-control"
                                       id="ppricee"
                                       name="ppricee"
                                       placeholder="0.00"
                                       min="0"
                                       step="0.01"
                                       required>
                            </div>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="pqnty" class="form-label">
                                Product Quantity *
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="pqnty"
                                   name="pqnty"
                                   placeholder="Enter quantity"
                                   min="0"
                                   step="1"
                                   required>
                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex flex-column flex-sm-row gap-3">
                        <button type="submit" class="btn btn-primary btn-add flex-grow-1">
                            <i class="bi bi-plus-circle me-2"></i>Add Product
                        </button>

                        <button type="reset" class="btn btn-outline-secondary btn-reset px-4">
                            <i class="bi bi-arrow-counterclockwise me-2"></i>Clear
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
